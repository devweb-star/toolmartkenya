<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Blog - ToolMart Solutions | Construction Tips & Guides</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

<style>
:root {
  --primary: #007fff;
  --primary-dark: #0066d6;
  --primary-light: #66b3ff;
  --secondary: #00a6ff;
  --secondary-dark: #008fe0;
  --accent: #7dd3fc;
  --dark: #0f172a;
  --light: #f8fafc;
  --gray: #64748b;
  --white: #ffffff;
  --shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
  --shadow-lg: 0 20px 25px -5px rgba(0, 0, 0, 0.1);
}

* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  font-family: 'Inter', sans-serif;
  color: var(--dark);
  background: var(--light);
  line-height: 1.6;
}

/* Header */
header {
  background: var(--white);
  box-shadow: var(--shadow);
  position: sticky;
  top: 0;
  z-index: 1000;
}

.top-bar {
  background: linear-gradient(135deg, var(--dark) 0%, #1e293b 100%);
  color: var(--white);
  padding: 10px 0;
  font-size: 0.9rem;
}

.top-bar .container {
  max-width: 1400px;
  margin: 0 auto;
  padding: 0 20px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  flex-wrap: wrap;
  gap: 15px;
}

.contact-info span {
  margin-right: 25px;
  display: inline-flex;
  align-items: center;
  gap: 8px;
}

.contact-info i { color: var(--secondary); }

.navbar { padding: 15px 0; }

.nav-container {
  display: flex;
  justify-content: space-between;
  align-items: center;
  max-width: 1400px;
  margin: 0 auto;
  padding: 0 20px;
}

.logo {
  display: flex;
  align-items: center;
  gap: 12px;
  font-size: 1.8rem;
  font-weight: 800;
  color: var(--primary);
  text-decoration: none;
}

.logo-icon {
  width: 50px;
  height: 50px;
  background: linear-gradient(135deg, var(--primary) 0%, var(--secondary) 100%);
  border-radius: 12px;
  display: flex;
  align-items: center;
  justify-content: center;
  color: var(--white);
  font-size: 1.5rem;
}

.nav-links {
  display: flex;
  gap: 35px;
  list-style: none;
  align-items: center;
}

.nav-links a {
  color: var(--dark);
  font-weight: 500;
  transition: color 0.3s;
  text-decoration: none;
}

.nav-links a:hover, .nav-links a.active { color: var(--primary); }

    /* Dropdown Menu Styles */
    .nav-links > li {
      position: relative;
    }

    .dropdown-toggle {
      display: flex;
      align-items: center;
      gap: 6px;
      cursor: pointer;
      color: var(--dark);
      font-weight: 500;
      transition: color 0.3s;
    }

    .dropdown-toggle:hover {
      color: var(--primary);
    }

    .dropdown-menu {
      position: absolute;
      top: 100%;
      left: 0;
      background: var(--white);
      border-radius: 12px;
      box-shadow: var(--shadow-lg);
      min-width: 280px;
      margin-top: 8px;
      border: 1px solid rgba(15, 23, 42, 0.08);
      opacity: 0;
      visibility: hidden;
      transform: translateY(-10px);
      transition: all 0.3s ease;
      z-index: 2000;
      max-height: none; overflow: visible;
    }

    .nav-links > li:hover .dropdown-menu,
    .nav-links > li:focus-within .dropdown-menu {
      opacity: 1;
      visibility: visible;
      transform: translateY(0);
    }

    .dropdown-item {
      padding: 0;
      margin: 0;
      display: block;
    }

    .dropdown-item > a {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 16px;
      color: var(--dark);
      font-weight: 500;
      transition: all 0.2s ease;
      border-left: 3px solid transparent;
      text-decoration: none;
      cursor: pointer;
    }

    .dropdown-item > a:hover {
      background: rgba(0, 127, 255, 0.08);
      color: var(--primary);
      border-left-color: var(--primary);
    }

    .dropdown-item {
      position: relative;
    }

    .submenu {
      position: absolute;
      left: 100%;
      top: 0;
      background: var(--white);
      border-radius: 12px;
      box-shadow: var(--shadow-lg);
      min-width: 240px;
      margin-left: 8px;
      border: 1px solid rgba(15, 23, 42, 0.08);
      opacity: 0;
      visibility: hidden;
      transform: translateX(-10px);
      transition: all 0.3s ease;
      z-index: 2001;
      max-height: none; overflow: visible;
    }

    .dropdown-item:hover .submenu,
    .dropdown-item:hover .dropdown-menu,
    .dropdown-item:focus-within .submenu,
    .dropdown-item:focus-within .dropdown-menu {
      opacity: 1;
      visibility: visible;
      transform: translateX(0);
    }

    .submenu-item {
      padding: 0;
      margin: 0;
    }

    .submenu-item > a {
      display: block;
      padding: 12px 16px;
      color: var(--gray);
      font-weight: 500;
      font-size: 0.9rem;
      transition: all 0.2s ease;
      border-left: 3px solid transparent;
      text-decoration: none;
      cursor: pointer;
    }

    .submenu-item > a:hover {
      background: rgba(0, 127, 255, 0.08);
      color: var(--primary);
      border-left-color: var(--primary);
    }
/* Blog Hero */
.blog-hero {
  background: linear-gradient(135deg, rgba(15, 23, 42, 0.9) 0%, rgba(30, 58, 138, 0.85) 100%),
              url('https://images.unsplash.com/photo-1504307651254-35680f356dfd?w=1920') center/cover;
  color: var(--white);
  padding: 80px 0;
  text-align: center;
}

.blog-hero h1 {
  font-size: 3rem;
  font-weight: 800;
  margin-bottom: 15px;
}

.blog-hero h1 span { color: var(--secondary); }

.blog-hero p {
  font-size: 1.2rem;
  opacity: 0.95;
  max-width: 600px;
  margin: 0 auto;
}

/* Blog Container */
.blog-container {
  max-width: 1200px;
  margin: 0 auto;
  padding: 60px 20px;
}

/* Blog List View */
.blog-list {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(350px, 1fr));
  gap: 30px;
  margin-bottom: 60px;
}

.blog-card {
  background: var(--white);
  border-radius: 20px;
  overflow: hidden;
  box-shadow: var(--shadow);
  transition: all 0.4s;
  cursor: pointer;
}

.blog-card:hover {
  transform: translateY(-8px);
  box-shadow: var(--shadow-lg);
}

.blog-card-image {
  height: 240px;
  overflow: hidden;
  position: relative;
}

.blog-card-image img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  transition: transform 0.4s;
}

.blog-card:hover .blog-card-image img { transform: scale(1.1); }

.blog-category {
  position: absolute;
  top: 20px;
  left: 20px;
  background: var(--secondary);
  color: var(--white);
  padding: 6px 16px;
  border-radius: 20px;
  font-size: 0.8rem;
  font-weight: 600;
  text-transform: uppercase;
}

.blog-card-content { padding: 25px; }

.blog-meta {
  display: flex;
  gap: 20px;
  margin-bottom: 15px;
  font-size: 0.85rem;
  color: var(--gray);
}

.blog-meta span {
  display: flex;
  align-items: center;
  gap: 6px;
}

.blog-card-content h3 {
  font-size: 1.3rem;
  font-weight: 700;
  margin-bottom: 15px;
  color: var(--dark);
  line-height: 1.4;
}

.blog-card-content p {
  color: var(--gray);
  margin-bottom: 20px;
  line-height: 1.7;
}

.read-more {
  color: var(--primary);
  font-weight: 600;
  text-decoration: none;
  display: inline-flex;
  align-items: center;
  gap: 8px;
  transition: gap 0.3s;
  cursor: pointer;
  background: none;
  border: none;
  font-size: 1rem;
  font-family: inherit;
}

.read-more:hover { gap: 12px; }

/* Full Article View */
.article-view {
  display: none;
  background: var(--white);
  border-radius: 20px;
  box-shadow: var(--shadow);
  overflow: hidden;
}

.article-view.active { display: block; }

.article-hero {
  height: 400px;
  position: relative;
  overflow: hidden;
}

.article-hero img {
  width: 100%;
  height: 100%;
  object-fit: cover;
}

.article-hero-overlay {
  position: absolute;
  bottom: 0;
  left: 0;
  right: 0;
  background: linear-gradient(to top, rgba(0,0,0,0.85), transparent);
  padding: 40px;
  color: var(--white);
}

.article-hero-overlay .blog-category {
  position: static;
  display: inline-block;
  margin-bottom: 15px;
}

.article-hero-overlay h1 {
  font-size: 2.5rem;
  font-weight: 800;
  line-height: 1.3;
  margin-bottom: 15px;
}

.article-meta {
  display: flex;
  gap: 25px;
  flex-wrap: wrap;
  font-size: 0.95rem;
}

.article-meta span {
  display: flex;
  align-items: center;
  gap: 8px;
}

.article-body {
  padding: 50px 40px;
  max-width: 900px;
  margin: 0 auto;
}

.article-body h2 {
  font-size: 1.8rem;
  font-weight: 700;
  margin: 35px 0 15px;
  color: var(--dark);
  position: relative;
  padding-left: 20px;
}

.article-body h2::before {
  content: '';
  position: absolute;
  left: 0;
  top: 5px;
  bottom: 5px;
  width: 5px;
  background: var(--secondary);
  border-radius: 3px;
}

.article-body h3 {
  font-size: 1.4rem;
  font-weight: 700;
  margin: 25px 0 12px;
  color: var(--primary);
}

.article-body p {
  font-size: 1.05rem;
  line-height: 1.8;
  color: #334155;
  margin-bottom: 18px;
}

.article-body ul, .article-body ol {
  margin: 20px 0;
  padding-left: 25px;
}

.article-body li {
  font-size: 1.05rem;
  line-height: 1.8;
  color: #334155;
  margin-bottom: 10px;
}

.article-body blockquote {
  background: linear-gradient(135deg, #eff6ff 0%, #f0f9ff 100%);
  border-left: 5px solid var(--primary);
  padding: 25px 30px;
  margin: 30px 0;
  border-radius: 10px;
  font-style: italic;
  font-size: 1.1rem;
  color: var(--dark);
}

.article-body .highlight-box {
  background: linear-gradient(135deg, #fff7ed 0%, #ffedd5 100%);
  border-left: 5px solid var(--secondary);
  padding: 25px 30px;
  margin: 30px 0;
  border-radius: 10px;
}

.article-body .highlight-box h4 {
  color: var(--secondary-dark);
  margin-bottom: 10px;
  font-size: 1.1rem;
  display: flex;
  align-items: center;
  gap: 10px;
}

.article-body .product-mention {
  background: var(--light);
  border: 2px solid #e2e8f0;
  padding: 20px;
  border-radius: 12px;
  margin: 25px 0;
  display: flex;
  align-items: center;
  gap: 20px;
}

.article-body .product-mention .product-icon {
  width: 70px;
  height: 70px;
  background: var(--white);
  border-radius: 12px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 2rem;
  flex-shrink: 0;
  border: 2px solid var(--primary-light);
}

.article-body .product-mention .product-info h4 {
  color: var(--primary);
  margin-bottom: 5px;
}

.article-body .product-mention .product-info p {
  margin: 0;
  font-size: 0.95rem;
}

.article-body .product-icon { overflow: hidden; text-decoration: none; }
.article-body .product-icon img { width: 100%; height: 100%; padding: 6px; object-fit: contain; }
.article-body .product-info { flex: 1; min-width: 0; }
.article-body .product-info h4 a { color: inherit; text-decoration: none; }
.article-body .product-info h4 a:hover { text-decoration: underline; text-underline-offset: 3px; }
.catalog-product-meta { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-top: 12px; flex-wrap: wrap; }
.catalog-product-price { color: var(--dark); font-weight: 800; }
.catalog-product-link { display: inline-flex; align-items: center; justify-content: center; padding: 8px 12px; border-radius: 8px; background: var(--primary); color: var(--white) !important; font-weight: 700; text-decoration: none; }
.catalog-product-link:hover { background: var(--primary-dark); }

.back-btn {
  display: inline-flex;
  align-items: center;
  gap: 10px;
  background: var(--primary);
  color: var(--white);
  padding: 12px 25px;
  border-radius: 25px;
  font-weight: 600;
  cursor: pointer;
  border: none;
  font-family: inherit;
  font-size: 1rem;
  margin-bottom: 30px;
  transition: all 0.3s;
}

.back-btn:hover {
  background: var(--primary-dark);
  transform: translateX(-5px);
}

/* Article Navigation */
.article-nav {
  display: flex;
  justify-content: space-between;
  margin-top: 50px;
  padding-top: 30px;
  border-top: 2px solid var(--light);
  gap: 20px;
  flex-wrap: wrap;
}

.article-nav-btn {
  flex: 1;
  min-width: 250px;
  background: var(--light);
  padding: 20px;
  border-radius: 12px;
  cursor: pointer;
  transition: all 0.3s;
  border: 2px solid transparent;
}

.article-nav-btn:hover {
  border-color: var(--primary);
  background: var(--white);
}

.article-nav-btn .label {
  font-size: 0.85rem;
  color: var(--gray);
  margin-bottom: 5px;
  display: flex;
  align-items: center;
  gap: 8px;
}

.article-nav-btn .title {
  font-weight: 600;
  color: var(--dark);
}

/* Share buttons */
.share-buttons {
  display: flex;
  gap: 12px;
  margin: 30px 0;
  flex-wrap: wrap;
}

.share-btn {
  padding: 10px 20px;
  border-radius: 25px;
  color: var(--white);
  text-decoration: none;
  font-size: 0.9rem;
  font-weight: 600;
  display: inline-flex;
  align-items: center;
  gap: 8px;
  transition: all 0.3s;
}

.share-btn:hover { transform: translateY(-2px); }
.share-btn.whatsapp { background: #25D366; }
.share-btn.facebook { background: #1877f2; }
.share-btn.twitter { background: #1DA1F2; }
.share-btn.copy { background: var(--dark); }

/* CTA */
.article-cta {
  background: linear-gradient(135deg, var(--primary) 0%, var(--accent) 100%);
  padding: 50px 40px;
  border-radius: 20px;
  text-align: center;
  color: var(--white);
  margin-top: 50px;
}

.article-cta h3 {
  font-size: 1.8rem;
  margin-bottom: 15px;
}

.article-cta p {
  margin-bottom: 25px;
  opacity: 0.95;
  font-size: 1.1rem;
}

.article-cta .btn {
  background: var(--secondary);
  color: var(--white);
  padding: 14px 32px;
  border-radius: 30px;
  font-weight: 600;
  text-decoration: none;
  display: inline-flex;
  align-items: center;
  gap: 10px;
  transition: all 0.3s;
}

.article-cta .btn:hover {
  background: var(--secondary-dark);
  transform: translateY(-3px);
}

/* Floating Buttons */
.floating-buttons {
  position: fixed;
  bottom: 30px;
  right: 30px;
  display: flex;
  flex-direction: column;
  gap: 15px;
  z-index: 999;
}

.float-btn {
  width: 60px;
  height: 60px;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  color: var(--white);
  font-size: 1.5rem;
  box-shadow: 0 5px 20px rgba(0, 0, 0, 0.3);
  cursor: pointer;
  transition: all 0.3s;
  text-decoration: none;
  animation: float 3s ease-in-out infinite;
}

.float-btn:hover { transform: scale(1.1); }
.float-btn.whatsapp { background: #25D366; animation-delay: 0s; }
.float-btn.call { background: var(--primary); animation-delay: 0.5s; }

@keyframes float {
  0%, 100% { transform: translateY(0); }
  50% { transform: translateY(-10px); }
}

/* Footer */
footer {
  background: var(--dark);
  color: var(--white);
  padding: 40px 0 20px;
  text-align: center;
}

.footer-bottom {
  max-width: 1400px;
  margin: 0 auto;
  padding: 0 20px;
  font-size: 0.9rem;
  opacity: 0.7;
}

/* Responsive */
@media (max-width: 768px) {
  .blog-hero h1 { font-size: 2rem; }
  .article-hero { height: 280px; }
  .article-hero-overlay h1 { font-size: 1.6rem; }
  .article-body { padding: 30px 20px; }
  .article-body h2 { font-size: 1.4rem; }
  .article-body h3 { font-size: 1.2rem; }
  .nav-container { flex-wrap: wrap; row-gap: 12px; }
  .nav-links { display: flex; width: 100%; justify-content: center; flex-wrap: wrap; gap: 14px; padding-top: 10px; border-top: 1px solid rgba(15, 23, 42, 0.08); }
  .article-body .product-mention { flex-direction: column; text-align: center; }
  .catalog-product-meta { justify-content: center; }

      <p>Choosing the right water pump is one of the most critical decisions on any construction site. Whether you're dewatering a foundation, supplying water for concrete mixing, or managing drainage during the rainy season, the wrong pump can lead to costly delays and equipment failure.</p>

      <p>In this comprehensive guide, we'll walk you through everything you need to know to make an informed decision that matches your project's specific requirements.</p>

      <h2>Understanding Your Water Pumping Needs</h2>

      <p>Before browsing through pump options, take time to assess your specific requirements. Ask yourself these key questions:</p>

      <ul>
        <li><strong>What is the water source?</strong> Clean water, muddy water, or water with debris?</li>
        <li><strong>What is the required flow rate?</strong> Measured in liters per minute or hour.</li>
        <li><strong>What is the total head?</strong> The vertical distance the water needs to be lifted.</li>
        <li><strong>What power source is available?</strong> Electricity, petrol, diesel, or solar?</li>
        <li><strong>How frequently will it be used?</strong> Continuous duty or intermittent use?</li>
      </ul>

      <h2>Types of Water Pumps for Construction</h2>

      <h3>1. Petrol Water Pumps</h3>
      <p>Ideal for small to medium construction sites where portability is key. Petrol pumps are lightweight, easy to start, and perfect for dewatering shallow excavations.</p>

      <h3>2. Diesel Water Pumps</h3>
      <p>Best for heavy-duty, continuous operation on large construction sites. Diesel pumps offer superior fuel efficiency and longer operational life under demanding conditions.</p>

      <h3>3. Submersible Pumps</h3>
      <p>Designed to operate while fully submerged in water. Ideal for deep foundation dewatering, borehole water extraction, and flooded basement removal.</p>

      <div class="product-mention">

        </div>

      <h3>4. High Pressure Pumps</h3>
      <p>Essential for site cleaning, concrete surface preparation, and equipment washing. These pumps deliver water at pressures up to 3000 PSI.</p>

      <h2>Key Factors to Consider</h2>

      <h3>Flow Rate (Capacity)</h3>
      <p>Measured in liters per minute (LPM) or gallons per minute (GPM). For typical construction dewatering, you'll need a pump with at least 500-1000 LPM capacity.</p>

      <h3>Total Head</h3>
      <p>This is the maximum vertical height the pump can push water. Always choose a pump with 20-30% more head capacity than your actual requirement to account for pipe friction losses.</p>

      <h3>Inlet and Outlet Size</h3>
      <p>Common sizes are 2-inch, 3-inch, and 4-inch. Larger diameters allow higher flow rates but require bigger hoses and fittings.</p>

      <blockquote>

      <p>Generators are the lifeline of any construction site, providing essential power when the grid fails or when working in remote locations. However, like any mechanical equipment, generators require regular maintenance to perform reliably and achieve their full lifespan potential.</p>

      <p>A well-maintained generator can last 20,000+ hours of operation, while a neglected one might fail in less than 5,000 hours. In this guide, we'll share the essential maintenance practices that will keep your generators running smoothly for years to come.</p>

      <h2>The Importance of Regular Maintenance</h2>

      <p>Regular maintenance isn't just about preventing breakdowns - it's about protecting your investment. Consider this: a 50KVA diesel generator costs over KSh 800,000. With proper maintenance, it can serve you reliably for 15-20 years. Without it, you might need to replace it in just 5-7 years.</p>

      <h2>Daily Maintenance Checks</h2>

      <p>Before starting your generator each day (or each shift on busy sites), perform these quick checks:</p>

      <ol>
        <li><strong>Oil level check:</strong> Ensure the engine oil is at the proper level. Low oil can cause catastrophic engine damage within minutes.</li>
        <li><strong>Coolant level:</strong> Check the radiator coolant level. Never open a hot radiator cap.</li>
        <li><strong>Fuel level:</strong> Ensure adequate fuel for the expected run time.</li>
        <li><strong>Visual inspection:</strong> Look for leaks, loose connections, or damaged belts.</li>
        <li><strong>Battery check:</strong> Verify battery terminals are clean and connections are tight.</li>
      </ol>

      <h2>Weekly Maintenance Tasks</h2>

      <h3>Air Filter Inspection</h3>
      <p>The air filter prevents dust and debris from entering the engine. On construction sites with heavy dust, check the air filter weekly. Clean or replace it when it appears dirty. A clogged air filter reduces fuel efficiency by up to 10% and increases engine wear.</p>

      <h3>Belt Tension Check</h3>
      <p>Inspect the alternator and fan belts for proper tension and signs of wear. Cracked, frayed, or glazed belts should be replaced immediately.</p>

      <h3>Cooling System</h3>

      <h2>Monthly Maintenance Tasks</h2>

      <p>Engine oil is the lifeblood of your generator. Change the oil and oil filter every 250 hours of operation or every 6 months, whichever comes first. Use only the manufacturer-recommended oil grade.</p>

    ]);
    if (!response.ok) throw new Error('Failed to load data.json');
    const data = await response.json();
    blogPosts = Array.isArray(data) ? data : data.posts || [];

    if (catalogResponse?.ok) {
      const catalog = await catalogResponse.json();
      catalogProducts = Object.entries(catalog.categories || {}).flatMap(([categoryKey, category]) =>
        Object.entries(category.subcategories || {}).flatMap(([subcategoryKey, subcategory]) =>
          (subcategory.products || []).map((product) => ({
            ...product,
            path: `categories/${categoryKey}/${product.url}`,
            categoryKey,
            subcategoryKey
          }))
        )
      );
    }

    if (!blogPosts.length) {
      list.innerHTML = '<p class="empty-state">No articles available right now.</p>';
      return;
    }

    renderBlogList();
    checkUrlForArticle();
  } catch (error) {
    console.error(error);
    list.innerHTML = '<p class="empty-state">Unable to load articles. Please refresh the page.</p>';
  }
}

// Render blog list
function renderBlogList() {
  const list = document.getElementById('blogList');
  list.innerHTML = '';
  
  blogPosts.forEach(post => {
    const card = document.createElement('div');
    card.className = 'blog-card';
    card.onclick = () => showArticle(post.id);
    card.innerHTML = `
      <div class="blog-card-image">
        <img src="${post.image}" alt="${post.title}">
        <span class="blog-category">${post.category}</span>
      </div>
      <div class="blog-card-content">
        <div class="blog-meta">
          <span><i class="far fa-calendar"></i> ${post.date}</span>
          <span><i class="far fa-clock"></i> ${post.readTime}</span>
        </div>
        <h3>${post.title}</h3>
        <p>${post.excerpt}</p>
        <button class="read-more">Read Full Article <i class="fas fa-arrow-right"></i></button>
      </div>
    `;
    list.appendChild(card);
  });
}

// Show full article
function showArticle(id) {
  const post = blogPosts.find(p => p.id === id);
  if (!post) return;

  const articleContent = document.createElement('div');
  articleContent.innerHTML = post.content;
  const relatedProducts = (post.relatedProductPaths || []).map((path) =>
    catalogProducts.find((product) => product.path === path)
  );
  articleContent.querySelectorAll('.product-mention').forEach((callout, index) => {
    const product = relatedProducts[index];
    if (product) callout.outerHTML = renderCatalogProduct(product);
  });
  
  const prevPost = blogPosts.find(p => p.id === id - 1);
  const nextPost = blogPosts.find(p => p.id === id + 1);
  
  const content = document.getElementById('articleContent');
  content.innerHTML = `
    <div class="article-hero">
      <img src="${post.image}" alt="${post.title}">
      <div class="article-hero-overlay">
        <span class="blog-category">${post.category}</span>
        <h1>${post.title}</h1>
        <div class="article-meta">
          <span><i class="far fa-user"></i> ${post.author}</span>
          <span><i class="far fa-calendar"></i> ${post.date}</span>
          <span><i class="far fa-clock"></i> ${post.readTime}</span>
        </div>
      </div>
    </div>
    <div class="article-body">
      ${articleContent.innerHTML}
      
      <div class="share-buttons">
        <a href="https://wa.me/?text=${encodeURIComponent(post.title + ' - ' + window.location.href)}" class="share-btn whatsapp" target="_blank">
          <i class="fab fa-whatsapp"></i> WhatsApp
        </a>
        <a href="https://www.facebook.com/sharer/sharer.php?u=${encodeURIComponent(window.location.href)}" class="share-btn facebook" target="_blank">
          <i class="fab fa-facebook-f"></i> Facebook
        </a>
        <a href="https://twitter.com/intent/tweet?text=${encodeURIComponent(post.title)}&url=${encodeURIComponent(window.location.href)}" class="share-btn twitter" target="_blank">
          <i class="fab fa-twitter"></i> Twitter
        </a>
        <button class="share-btn copy" onclick="copyLink()">
          <i class="fas fa-link"></i> Copy Link
        </button>
      </div>
      
      <div class="article-cta">
        <h3>Need These Products?</h3>
        <p>Browse our complete catalog of professional-grade tools and equipment</p>
        <a href="index.html#products" class="btn">
          <i class="fas fa-shopping-bag"></i> Shop Now
        </a>
      </div>
      
      <div class="article-nav">
        ${prevPost ? `
          <div class="article-nav-btn" onclick="showArticle(${prevPost.id})">
            <div class="label"><i class="fas fa-arrow-left"></i> Previous Article</div>
            <div class="title">${prevPost.title}</div>
          </div>
        ` : '<div></div>'}
        ${nextPost ? `
          <div class="article-nav-btn" onclick="showArticle(${nextPost.id})" style="text-align:right;">
            <div class="label" style="justify-content:flex-end;">Next Article <i class="fas fa-arrow-right"></i></div>
            <div class="title">${nextPost.title}</div>
          </div>
        ` : '<div></div>'}
      </div>
    </div>
  `;
  
  document.getElementById('blogListView').style.display = 'none';
  document.getElementById('articleView').classList.add('active');
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

// Show blog list
function showBlogList() {
  document.getElementById('blogListView').style.display = 'block';
  document.getElementById('articleView').classList.remove('active');
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

// Copy link
function copyLink() {
  navigator.clipboard.writeText(window.location.href).then(() => {
    alert('Link copied to clipboard!');
  });
}

// Check URL for direct article access
function checkUrlForArticle() {
  const hash = window.location.hash;
  if (hash.startsWith('#article-')) {
    const id = parseInt(hash.replace('#article-', ''));
    if (blogPosts.find(p => p.id === id)) {
      showArticle(id);
    }
  }
}
