<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>All Categories | ToolMart</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    :root {
      --primary: #007fff;
      --primary-dark: #0066d6;
      --primary-light: #66b3ff;
      --secondary: #00a6ff;
      --secondary-dark: #008fe0;
      --accent: #7dd3fc;
      --dark: #0f172a;
      --light: #f8fafc;
      --gray: #64748b;
      --white: #ffffff;
      --shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
      --shadow-lg: 0 20px 25px -5px rgba(0, 0, 0, 0.1);
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: 'Inter', sans-serif;
      background: var(--light);
      color: var(--dark);
      line-height: 1.6;
    }

    a { text-decoration: none; }
    .container { max-width: 1200px; margin: 0 auto; padding: 0 20px; }

    header {
      background: rgba(255,255,255,0.96);
      border-bottom: 1px solid rgba(15, 23, 42, 0.08);
      position: sticky; top: 0; z-index: 20;
      box-shadow: var(--shadow);
    }

    .topbar {
      background: linear-gradient(135deg, var(--dark) 0%, #1e293b 100%);
      padding: 10px 0; color: var(--white); font-size: 0.9rem;
    }

    .topbar-inner, .nav-inner {
      display: flex; justify-content: space-between; align-items: center; gap: 16px; flex-wrap: wrap;
    }

    .topbar .contact {
      display: flex; gap: 20px; align-items: center; flex-wrap: wrap;
    }

    .topbar i { color: var(--secondary); }

    .nav-inner { padding: 16px 0; }

    .logo {
      display: flex; align-items: center; gap: 12px; font-weight: 800; font-size: 1.8rem; color: var(--primary);
    }

    .logo-mark {
      width: 48px; height: 48px; display: grid; place-items: center; border-radius: 12px;
      background: linear-gradient(135deg, var(--primary) 0%, var(--secondary) 100%); color: var(--white);
      font-size: 1.4rem;
    }

    .nav-links {
      display: flex; gap: 28px; align-items: center; list-style: none; margin: 0; padding: 0;
    }

    .nav-links a {
      color: var(--dark); font-weight: 500;
    }

    .nav-links a:hover { color: var(--primary); }

    /* Dropdown Menu Styles */
    .nav-links > li {
      position: relative;
    }

    .dropdown-toggle {
      display: flex;
      align-items: center;
      gap: 6px;
      cursor: pointer;
      color: var(--dark);
      font-weight: 500;
      transition: color 0.3s;
    }

    .dropdown-toggle:hover {
      color: var(--primary);
    }

    .dropdown-menu {
      position: absolute;
      top: 100%;
      left: 0;
      background: var(--white);
      border-radius: 12px;
      box-shadow: var(--shadow-lg);
      min-width: 280px;
      margin-top: 8px;
      border: 1px solid rgba(15, 23, 42, 0.08);
      opacity: 0;
      visibility: hidden;
      transform: translateY(-10px);
      transition: all 0.3s ease;
      z-index: 2000;
      max-height: none; overflow: visible;
    }

    .nav-links > li:hover .dropdown-menu,
    .nav-links > li:focus-within .dropdown-menu {
      opacity: 1;
      visibility: visible;
      transform: translateY(0);
    }

    .dropdown-item {
      padding: 0;
      margin: 0;
      display: block;
    }

    .dropdown-item > a {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 16px;
      color: var(--dark);
      font-weight: 500;
      transition: all 0.2s ease;
      border-left: 3px solid transparent;
      text-decoration: none;
      cursor: pointer;
    }

    .dropdown-item > a:hover {
      background: rgba(0, 127, 255, 0.08);
      color: var(--primary);
      border-left-color: var(--primary);
    }

    .dropdown-item {
      position: relative;
    }

    .submenu {
      position: absolute;
      left: 100%;
      top: 0;
      background: var(--white);
      border-radius: 12px;
      box-shadow: var(--shadow-lg);
      min-width: 240px;
      margin-left: 8px;
      border: 1px solid rgba(15, 23, 42, 0.08);
      opacity: 0;
      visibility: hidden;
      transform: translateX(-10px);
      transition: all 0.3s ease;
      z-index: 2001;
      max-height: none; overflow: visible;
    }

    .dropdown-item:hover .submenu,
    .dropdown-item:hover .dropdown-menu,
    .dropdown-item:focus-within .submenu,
    .dropdown-item:focus-within .dropdown-menu {
      opacity: 1;
      visibility: visible;
      transform: translateX(0);
    }

    .submenu-item {
      padding: 0;
      margin: 0;
    }

    .submenu-item > a {
      display: block;
      padding: 12px 16px;
      color: var(--gray);
      font-weight: 500;
      font-size: 0.9rem;
      transition: all 0.2s ease;
      border-left: 3px solid transparent;
      text-decoration: none;
      cursor: pointer;
    }

    .submenu-item > a:hover {
      background: rgba(0, 127, 255, 0.08);
      color: var(--primary);
      border-left-color: var(--primary);
    }

    .hero {
      background: linear-gradient(135deg, var(--primary) 0%, var(--secondary) 100%);
      color: var(--white);
      padding: 72px 0 52px;
    }

    .eyebrow {
      display: inline-block; padding: 6px 12px; border-radius: 999px; background: rgba(255,255,255,0.15);
      font-size: 0.8rem; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase;
      margin-bottom: 18px;
    }

    h1 { margin: 0 0 12px; font-size: clamp(2rem, 5vw, 3.2rem); }
    .hero p { margin: 0; max-width: 720px; opacity: 0.95; }

    .catalog-wrap { padding: 48px 0 80px; }
    .catalog-header {
      display: flex; align-items: center; justify-content: space-between; gap: 18px; flex-wrap: wrap; margin-bottom: 26px;
    }

    .categories-grid {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 28px;
      margin-bottom: 40px;
    }

    .category-card {
      background: var(--white);
      border-radius: 20px;
      overflow: hidden;
      box-shadow: var(--shadow);
      border: 1px solid rgba(15, 23, 42, 0.05);
      transition: all 0.3s ease;
      display: flex;
      flex-direction: column;
    }

    .category-card:hover {
      transform: translateY(-4px);
      box-shadow: var(--shadow-lg);
    }

    .category-header {
      background: linear-gradient(135deg, var(--primary) 0%, var(--secondary) 100%);
      color: var(--white);
      padding: 28px;
      text-align: center;
    }

    .category-icon {
      font-size: 3rem;
      margin-bottom: 12px;
    }

    .category-name {
      margin: 0 0 8px;
      font-size: 1.4rem;
      font-weight: 800;
    }

    .category-desc {
      margin: 0;
      font-size: 0.9rem;
      opacity: 0.95;
    }

    .subcategories-list {
      padding: 20px;
      flex: 1;
      display: flex;
      flex-direction: column;
    }

    .subcategories-label {
      font-size: 0.8rem;
      font-weight: 700;
      color: var(--gray);
      text-transform: uppercase;
      letter-spacing: 0.08em;
      margin-bottom: 14px;
    }

    .subcategories {
      display: flex;
      flex-direction: column;
      gap: 10px;
      flex: 1;
    }

    .subcategory-link {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 12px 14px;
      background: rgba(0, 127, 255, 0.06);
      border-radius: 12px;
      color: var(--primary);
      font-weight: 600;
      transition: all 0.2s ease;
      border: 1px solid transparent;
    }

    .subcategory-link:hover {
      background: rgba(0, 127, 255, 0.12);
      border-color: var(--primary);
      transform: translateX(4px);
    }

    .subcategory-link i {
      font-size: 0.9rem;
    }

    .category-footer {
      padding: 14px 20px;
      border-top: 1px solid rgba(15, 23, 42, 0.08);
      text-align: center;
    }

    .view-category-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      background: var(--primary);
      color: var(--white);
      padding: 10px 20px;
      border-radius: 12px;
      font-weight: 700;
      font-size: 0.9rem;
      transition: all 0.2s ease;
      border: none;
      cursor: pointer;
      gap: 8px;
    }

    .view-category-btn:hover {
      background: var(--primary-dark);
      transform: scale(1.05);
    }

    .empty {
      width: 100%;
      text-align: center;
      color: var(--gray);
      background: var(--white);
      border-radius: 16px;
      padding: 60px 20px;
      box-shadow: var(--shadow);
    }

    footer {
      background: var(--dark);
      color: rgba(255, 255, 255, 0.8);
      padding: 30px 0;
    }

    .footer-note { text-align: center; margin: 0; font-size: 0.95rem; }

    @media (max-width: 640px) {
      .nav-inner, .topbar-inner { justify-content: center; }
      .nav-links { justify-content: center; flex-wrap: wrap; }
      .categories-grid { grid-template-columns: 1fr; }
      .product-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; }
    }

    @media (max-width: 480px) {
      .product-grid { grid-template-columns: 1fr; }
    }

    @media (min-width: 641px) and (max-width: 1100px) {
      .product-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    }

    .category-badge {
      display: inline-flex; align-items: center; gap: 8px; background: rgba(0,127,255,0.08); color: var(--primary);
      border: 1px solid rgba(0,127,255,0.15); border-radius: 999px; padding: 10px 16px; font-weight: 700;
    }

    .cta {
      display: inline-flex; align-items: center; justify-content: center; background: var(--primary); color: var(--white);

    }

    .product-grid {
      display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 20px;
    }

    .product-card {
      background: var(--white); border-radius: 20px; overflow: hidden; box-shadow: var(--shadow); border: 1px solid rgba(15, 23, 42, 0.05);
    }

    .product-image {
      position: relative; width: 100%; height: 240px; background: linear-gradient(135deg, #edf6ff 0%, #dbeafe 100%);

    }

    .product-image img {
      width: 100%; height: 100%; object-fit: contain; display: block;

    .product-badge {
      position: absolute; top: 14px; left: 14px; z-index: 2; background: rgba(0,127,255,0.9); color: var(--white);
      font-size: 0.7rem; font-weight: 800; letter-spacing: 0.08em; text-transform: uppercase; padding: 7px 10px; border-radius: 999px;
    }

    .product-rating {
      position: absolute; right: 14px; bottom: 14px; padding: 7px 10px; border-radius: 999px; background: rgba(15,23,42,0.8); color: var(--white);
      font-size: 0.8rem; font-weight: 700;
    }

    .product-body {
      padding: 18px 18px 20px;
    }

    .product-body h3 {
      margin: 0 0 10px; font-size: 1.1rem;
    }

    .product-body p {

    .product-price {

    .price {

    .old-price {
      font-size: 0.8rem; color: var(--gray); text-decoration: line-through; margin-right: 8px;
    }

    .empty {
      width: 100%; text-align: center; color: var(--gray); background: var(--white); border-radius: 16px; padding: 36px; box-shadow: var(--shadow);

<body>
  <header>
    <div class="topbar">
      <div class="container topbar-inner">
        <div class="contact">
          <span><i class="fas fa-phone"></i> +254 720 803 295</span>
          <span><i class="fas fa-envelope"></i> sales@toolmart.co.ke</span>
        </div>
        <span><i class="fas fa-clock"></i> Mon - Sat: 8:00 AM - 6:00 PM</span>
      </div>
    </div>
    <div class="container nav-inner">
      <a href="../index.html" class="logo" aria-label="ToolMart home">
        <span class="logo-mark"><i class="fas fa-hard-hat"></i></span>
        <span>Tool<span style="color: var(--secondary);">Mart</span></span>
      </a>
      <ul class="nav-links">
        <li><a href="../index.html">Home</a></li>
        
        <li><a href="../products.html">Products</a></li>
        <li><a href="../blog/index.html">Blog</a></li>
      </ul>
    </div>
  </header>

  <main>
    <section class="hero">
      <div class="container">
        <div class="eyebrow">Explore</div>
        <h1>All Categories</h1>
        <p>Browse our complete range of professional equipment and tools across all categories.</p>
      </div>
    </section>

    <section class="catalog-wrap">
      <div class="container">
        <div id="categoriesGrid" class="categories-grid"></div>
      </div>
    </section>
  </main>

  <footer>
    <div class="container">
      <p class="footer-note">&copy; 2026 ToolMart Solutions. All rights reserved.</p>
    </div>
  </footer>

  <script>
    const categoriesGrid = document.getElementById('categoriesGrid');

    function getCategoryLink(categoryKey) {
      const categoryMap = {
        'water-pumps': './water-pumps.html',
        'generators': './generators.html',
        'landscaping': './landscaping.html',
        'construction': './construction.html',
        'agricultural': './agricultural.html',
        'food-processing': './food-processing.html',
        'power-tools': './power-tools.html',
        'cleaning-equipment': './cleaning-equipment.html',
        'general-equipment': './general-equipment.html'
      };
      return categoryMap[categoryKey] || '#';
    }

    function renderCategories(data) {
      const categories = data.categories || {};
      
      if (!Object.keys(categories).length) {
        categoriesGrid.innerHTML = '<div class="empty">No categories found.</div>';
        return;
      }

      categoriesGrid.innerHTML = Object.entries(categories)
        .map(([categoryKey, category]) => {
          const subcategoryKeys = Object.keys(category.subcategories || {}).filter((subKey) => subKey !== 'products');
          const categoryLink = getCategoryLink(categoryKey);
          const categoryDirectory = categoryKey === 'cleaning' ? 'cleaning-equipment' : categoryKey === 'general' ? 'general-equipment' : categoryKey;
          
          return `
            <div class="category-card">
              <div class="category-header">
                <div class="category-icon">${category.icon || ''}</div>
                <h2 class="category-name">${category.name}</h2>
                <p class="category-desc">${category.description || ''}</p>
              </div>
              <div class="subcategories-list">
                <div class="subcategories-label">Subcategories (${subcategoryKeys.length})</div>
                <div class="subcategories">
                  ${subcategoryKeys.length > 0
                    ? subcategoryKeys
                        .slice(0, 5)
                        .map(subKey => {
                          const sub = category.subcategories[subKey];
                          return `
                            <a href="./${categoryDirectory}/${getSubcategoryFilename(categoryKey, subKey)}" class="subcategory-link">
                              <i class="fas fa-chevron-right"></i>
                              ${sub.name}
                            </a>
                          `;
                        })
                        .join('')
                      + (subcategoryKeys.length > 5 ? `<div style="padding: 12px 14px; color: var(--gray); font-size: 0.9rem;">+${subcategoryKeys.length - 5} more</div>` : '')
                    : '<div style="padding: 12px 14px; color: var(--gray);">No subcategories</div>'
                  }
                </div>
              </div>
              <div class="category-footer">
                <a href="${categoryLink}" class="view-category-btn">
                  <span>View All</span>
                  <i class="fas fa-arrow-right"></i>
                </a>
              </div>
            </div>
          `;
        })
        .join('');
    }

    async function loadCategories() {
      try {
        const response = await fetch('../product.json');
        if (!response.ok) throw new Error('Failed to load product.json');
        const data = await response.json();
        renderCategories(data);
      } catch (error) {
        console.error(error);
        categoriesGrid.innerHTML = '<div class="empty">Unable to load categories. Please try again later.</div>';
      }
    }

    loadCategories();

            function getSubcategoryFilename(categoryKey, subKey) {
      const subcategoryFiles = {
